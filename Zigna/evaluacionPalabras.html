<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZIGNA - Evaluación Palabras</title>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
body { background-color: #f5f7fa; }

/* HEADER */
header { background: white; padding: 10px 5%; border-bottom: 1px solid #f0f0f0; }
nav { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
.main-logo { height: 35px; }
.nav-menu { list-style: none; display: flex; gap: 15px; font-size: 14px; }

.user-box {
    display: flex;
    align-items: center;
    gap: 15px;
}

/* CONTENIDO */
.container {
    max-width: 900px;
    margin: 30px auto;
    padding: 0 15px;
}

h2 {
    text-align: center;
    margin-bottom: 20px;
}

/* ALERTA */
.alerta {
    display: none;
    background: #fff3cd;
    color: #856404;
    padding: 10px;
    border-radius: 10px;
    margin-bottom: 15px;
    text-align: center;
    font-weight: bold;
}

/* TARJETAS */
.question-card {
    background: white;
    border-radius: 15px;
    padding: 20px;
    margin-bottom: 20px;
    border: 1px solid #eee;
}

.error { border: 2px solid #ff4757; }
.correcta { border: 2px solid #00c853; }

.question-header {
    display: flex;
    gap: 20px;
    align-items: center;
}

.question-img {
    width: 120px;
    height: 120px;
    object-fit: contain;
    background: #eee;
    border-radius: 10px;
}

.options-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 10px;
}

.option {
    border: 1px solid #eee;
    padding: 10px;
    border-radius: 8px;
    cursor: pointer;
}

/* BOTONES */
.btn-main {
    background: linear-gradient(90deg, #8a4fff, #ff007a);
    color: white;
    border: none;
    padding: 12px 25px;
    border-radius: 20px;
    font-weight: bold;
    cursor: pointer;
}

.btn-secondary {
    background: #ccc;
    color: #333;
    border: none;
    padding: 10px 20px;
    border-radius: 20px;
    cursor: pointer;
}

.btn-container {
    text-align: center;
    margin-top: 30px;
}

/* RESULTADO */
.resultado {
    text-align: center;
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 20px;
}

.verde { color: #00c853; }
.rojo { color: #ff4757; }

</style>
</head>

<body>

<header>
    <nav>
        <img src="imag/Logo_Zigna.png" class="main-logo">

        <ul class="nav-menu">
            <li><a href="inicio.html" style="text-decoration:none; color:#333;">Inicio</a></li>
            <li><a href="modulos.html" style="text-decoration:none; color:#333;">Módulos</a></li>
            <li><a href="progreso.html" style="text-decoration:none; color:#333;">Progreso</a></li>
        </ul>

        <div class="user-box">
            <a href="login.html" style="text-decoration:none; color:#666;">Cerrar sesión</a>
            <div style="background:#ff007a;width:35px;height:35px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;">👤</div>
        </div>
    </nav>
</header>

<div class="container">

<button class="btn-secondary" onclick="window.location.href='M_palabras.html'">⬅ Volver al módulo</button>

<h2>Evaluación: Palabras LSM</h2>

<div id="alerta" class="alerta">
⚠️ Contesta todas las preguntas antes de finalizar.
</div>

<div id="resultado" class="resultado"></div>

<div id="preguntas"></div>

<div class="btn-container" id="btnFinalizar">
    <button class="btn-main" onclick="calificar()">Finalizar Evaluación</button>
</div>

</div>

<script>

const datos = [
{ id:'p1', correcta:'Hola', img:'imag/palabras/hola.png' },
{ id:'p2', correcta:'Adiós', img:'imag/palabras/adios.png' },
{ id:'p3', correcta:'Buen día', img:'imag/palabras/buen_dia.png' },
{ id:'p4', correcta:'Buenas noches', img:'imag/palabras/buenas_noches.png' },
{ id:'p5', correcta:'Mamá', img:'imag/palabras/mama.png' },
{ id:'p6', correcta:'Papá', img:'imag/palabras/papa.png' },
{ id:'p7', correcta:'Uno', img:'imag/palabras/uno.png' },
{ id:'p8', correcta:'Dos', img:'imag/palabras/dos.png' },
{ id:'p9', correcta:'Cinco', img:'imag/palabras/cinco.png' },
{ id:'p10', correcta:'Diez', img:'imag/palabras/diez.png' }
];

const contenedor = document.getElementById("preguntas");

datos.forEach((p, i) => {
    contenedor.innerHTML += `
    <div class="question-card" id="card-${p.id}">
        <div class="question-header">
            <img src="${p.img}" class="question-img">
            <div style="flex:1;">
                <p><strong>Pregunta ${i+1}</strong></p>
                <p>¿Qué palabra representa esta seña?</p>

                <div class="options-grid">
                    <label class="option"><input type="radio" name="${p.id}" value="${p.correcta}"> ${p.correcta}</label>
                    <label class="option"><input type="radio" name="${p.id}" value="Otra"> Otra</label>
                    <label class="option"><input type="radio" name="${p.id}" value="Ninguna"> Ninguna</label>
                    <label class="option"><input type="radio" name="${p.id}" value="No sé"> No sé</label>
                </div>
            </div>
        </div>
    </div>
    `;
});

function calificar() {

    let faltantes = false;
    document.getElementById("alerta").style.display = "none";

    datos.forEach(p => {
        const opciones = document.getElementsByName(p.id);
        const card = document.getElementById("card-" + p.id);

        let respondida = false;

        opciones.forEach(op => {
            if (op.checked) respondida = true;
        });

        if (!respondida) {
            card.classList.add("error");
            faltantes = true;
        } else {
            card.classList.remove("error");
        }
    });

    if (faltantes) {
        document.getElementById("alerta").style.display = "block";
        window.scrollTo(0, 0);
        return;
    }

    let aciertos = 0;

    datos.forEach(p => {
        const opciones = document.getElementsByName(p.id);
        const card = document.getElementById("card-" + p.id);

        opciones.forEach(op => {
            if (op.checked) {
                if (op.value === p.correcta) {
                    aciertos++;
                    card.classList.add("correcta");
                } else {
                    card.classList.add("error");
                }
            }
        });
    });

    let porcentaje = Math.round((aciertos / datos.length) * 100);

    localStorage.setItem("resultado_palabras", porcentaje);

    const resultadoDiv = document.getElementById("resultado");

    resultadoDiv.innerText = "Resultado: " + porcentaje + "% (" + aciertos + "/10)";
    resultadoDiv.classList.add(porcentaje >= 70 ? "verde" : "rojo");

    document.getElementById("btnFinalizar").style.display = "none";

    window.scrollTo(0, 0);
}

</script>

</body>
</html>
