<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZIGNA - Resultados</title>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
body { background-color: #f5f7fa; }

/* ===== HEADER (IGUAL A LOS DEMÁS) ===== */
header { background: white; padding: 10px 5%; border-bottom: 1px solid #f0f0f0; }
nav { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
.main-logo { height: 35px; }
.nav-menu { list-style: none; display: flex; gap: 15px; font-size: 14px; }

.user-box {
    display: flex;
    align-items: center;
    gap: 15px;
}

/* ===== CONTENIDO ===== */
.container {
    max-width: 900px;
    margin: 30px auto;
    padding: 0 15px;
}

h2 {
    text-align: center;
    margin-bottom: 30px;
}

/* ===== TARJETAS ===== */
.modulo-card {
    background: white;
    border-radius: 15px;
    padding: 20px;
    margin-bottom: 20px;
    border: 1px solid #eee;
    transition: 0.3s;
}

/* COLORES DINÁMICOS */
.verde { border-left: 8px solid #00c853; }
.naranja { border-left: 8px solid #ff9800; }
.sin-intento { border-left: 8px solid #ccc; }

/* ===== BARRA ===== */
.progress-bar {
    width: 100%;
    height: 12px;
    background: #eee;
    border-radius: 10px;
    overflow: hidden;
    margin-top: 10px;
}

.progress-fill {
    height: 100%;
    width: 0%;
    background: #ccc;
    transition: width 0.5s;
}

.verde .progress-fill { background: #00c853; }
.naranja .progress-fill { background: #ff9800; }

.estado {
    margin-top: 10px;
    font-size: 14px;
    font-weight: bold;
}

</style>
</head>

<body>

<!-- ===== HEADER CORRECTO ===== -->
<header>
    <nav>
        <img src="imag/Logo_Zigna.png" class="main-logo">

        <ul class="nav-menu">
            <li><a href="inicio.html" style="text-decoration:none; color:#333;">Inicio</a></li>
            <li><a href="modulos.html" style="text-decoration:none; color:#333;">Módulos</a></li>
            <li><a href="progreso.html" style="text-decoration:none; color:#333;">Progreso</a></li>
        </ul>

        <div class="user-box">
            <a href="login.html" style="text-decoration:none; color:#666;">Cerrar sesión</a>
            <div style="background:#ff007a;width:35px;height:35px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;">👤</div>
        </div>
    </nav>
</header>

<div class="container">

<h2>Resultados de Aprendizaje</h2>

<!-- ABECEDARIO -->
<div id="abecedario" class="modulo-card">
    <h3>Abecedario</h3>
    <div class="progress-bar">
        <div class="progress-fill" id="bar-abecedario"></div>
    </div>
    <div class="estado" id="estado-abecedario"></div>
</div>

<!-- PALABRAS -->
<div id="palabras" class="modulo-card">
    <h3>Palabras</h3>
    <div class="progress-bar">
        <div class="progress-fill" id="bar-palabras"></div>
    </div>
    <div class="estado" id="estado-palabras"></div>
</div>

<!-- FRASES -->
<div id="frases" class="modulo-card">
    <h3>Frases</h3>
    <div class="progress-bar">
        <div class="progress-fill" id="bar-frases"></div>
    </div>
    <div class="estado" id="estado-frases"></div>
</div>

</div>

<script>

/* 🔥 SIMULACIÓN DE BD LOCAL */
function obtenerResultado(modulo) {
    return localStorage.getItem("resultado_" + modulo);
}

function pintarModulo(modulo) {
    const valor = obtenerResultado(modulo);

    const card = document.getElementById(modulo);
    const barra = document.getElementById("bar-" + modulo);
    const estado = document.getElementById("estado-" + modulo);

    if (!valor) {
        card.classList.add("sin-intento");
        estado.innerText = "No has realizado la evaluación";
        barra.style.width = "0%";
        return;
    }

    const porcentaje = parseInt(valor);
    barra.style.width = porcentaje + "%";

    if (porcentaje >= 70) {
        card.classList.add("verde");
        estado.innerText = "✔ Aprobado (" + porcentaje + "%)";
    } else {
        card.classList.add("naranja");
        estado.innerText = "⚠ En progreso (" + porcentaje + "%)";
    }
}


pintarModulo("abecedario");
pintarModulo("palabras");
pintarModulo("frases");

</script>

</body>
</html>
