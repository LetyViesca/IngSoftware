<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZIGNA - Evaluación Frases</title>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
body { background-color: #f5f7fa; }

header { background: white; padding: 10px 5%; border-bottom: 1px solid #f0f0f0; }
nav { display: flex; justify-content: space-between; align-items: center; }
.main-logo { height: 35px; }
.nav-menu { list-style: none; display: flex; gap: 15px; }

.container {
    max-width: 900px;
    margin: 30px auto;
    padding: 0 15px;
}

h2 { text-align: center; margin-bottom: 25px; }

.mensaje-error {
    display: none;
    background: #fff3cd;
    color: #856404;
    padding: 12px;
    border-radius: 10px;
    margin-bottom: 20px;
    text-align: center;
    font-weight: bold;
}

.resultado {
    text-align: center;
    font-size: 24px;
    font-weight: bold;
    margin-bottom: 20px;
}

.question-card {
    background: white;
    border-radius: 15px;
    padding: 20px;
    margin-bottom: 20px;
    border: 1px solid #eee;
}

.error { border: 2px solid #ff4757; }
.correcto { border: 2px solid #00c853 !important; }
.incorrecto { border: 2px solid #ff4757 !important; }

.question-header {
    display: flex;
    gap: 20px;
    align-items: center;
}

.question-img {
    width: 120px;
    height: 120px;
    object-fit: contain;
    background: #fff;
    border-radius: 10px;
}

.options-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 10px;
}

.option {
    border: 1px solid #eee;
    padding: 10px;
    border-radius: 8px;
    cursor: pointer;
}

.btn-main {
    background: linear-gradient(90deg, #8a4fff, #ff007a);
    color: white;
    border: none;
    padding: 12px 25px;
    border-radius: 20px;
    font-weight: bold;
    cursor: pointer;
}

.btn-container { text-align: center; margin-top: 30px; }

.btn-volver {
    display: inline-block;
    margin-bottom: 20px;
    padding: 10px 20px;
    background: linear-gradient(90deg, #8a4fff, #ff007a);
    color: white;
    border-radius: 20px;
    text-decoration: none;
}
</style>
</head>

<body>

<div class="container">

<a href="M_frases.html" class="btn-volver">← Volver al módulo</a>

<h2>Evaluación: Frases LSM</h2>

<div id="mensajeError" class="mensaje-error">
⚠️ Contesta todas las preguntas antes de finalizar.
</div>

<div id="resultado" class="resultado"></div>
<div id="preguntas"></div>

<div class="btn-container" id="btnFinalizar">
<button class="btn-main" onclick="calificar()">Finalizar Evaluación</button>
</div>

</div>

<script>

const preguntas = [
{ id:'p1', correcta:'¿Cuál es tu nombre?', img:'imag/frases/nombre.png' },
{ id:'p2', correcta:'De nada', img:'imag/frases/de_nada.png' },
{ id:'p3', correcta:'Ayuda', img:'imag/frases/ayuda.png' },
{ id:'p4', correcta:'Lo siento', img:'imag/frases/lo_siento.png' },
{ id:'p5', correcta:'Tengo sed', img:'imag/frases/sed.png' },
{ id:'p6', correcta:'Con permiso', img:'imag/frases/con_permiso.png' },
{ id:'p7', correcta:'¿De dónde eres?', img:'imag/frases/de_donde.png' },
{ id:'p8', correcta:'¿Cuánto cuesta?', img:'imag/frases/cuanto_cuesta.png' },
{ id:'p9', correcta:'Estoy enfermo', img:'imag/frases/enfermo.png' },
{ id:'p10', correcta:'Me gusta', img:'imag/frases/me_gusta.png' }
];

const opciones = [
"¿Cuál es tu nombre?","De nada","Ayuda","Lo siento","Tengo sed",
"Con permiso","¿De dónde eres?","¿Cuánto cuesta?","Estoy enfermo","Me gusta"
];

const contenedor = document.getElementById("preguntas");

preguntas.forEach((p, i) => {

    let opcionesMezcladas = [...opciones].sort(() => Math.random() - 0.5).slice(0,4);

    if (!opcionesMezcladas.includes(p.correcta)) {
        opcionesMezcladas[0] = p.correcta;
    }

    contenedor.innerHTML += `
    <div class="question-card" id="card-${p.id}">
        <div class="question-header">
            <img src="${p.img}" class="question-img">
            <div style="flex:1;">
                <p><strong>Pregunta ${i+1}</strong></p>
                <p>¿Qué frase representa esta seña?</p>

                <div class="options-grid">
                    ${opcionesMezcladas.map(op => `
                        <label class="option">
                        <input type="radio" name="${p.id}" value="${op}"> ${op}
                        </label>
                    `).join("")}
                </div>
            </div>
        </div>
    </div>
    `;
});

function calificar() {

let faltantes = false;
document.getElementById("mensajeError").style.display = "none";

preguntas.forEach(p => {
    const opciones = document.getElementsByName(p.id);
    const card = document.getElementById("card-" + p.id);

    let respondida = false;
    opciones.forEach(op => { if (op.checked) respondida = true; });

    if (!respondida) {
        card.classList.add("error");
        faltantes = true;
    } else {
        card.classList.remove("error");
    }
});

if (faltantes) {
    document.getElementById("mensajeError").style.display = "block";
    window.scrollTo(0, 0);
    return;
}

let aciertos = 0;

preguntas.forEach(p => {
    const opciones = document.getElementsByName(p.id);
    const card = document.getElementById("card-" + p.id);

    opciones.forEach(op => {
        if (op.checked) {
            if (op.value === p.correcta) {
                aciertos++;
                card.classList.add("correcto");
            } else {
                card.classList.add("incorrecto");
            }
        }
    });
});

let porcentaje = Math.round((aciertos / 10) * 100);

const res = document.getElementById("resultado");
res.innerText = "Resultado: " + aciertos + " / 10 (" + porcentaje + "%)";
res.style.color = porcentaje >= 70 ? "#00c853" : "#ff4757";

document.getElementById("btnFinalizar").style.display = "none";
}

</script>

</body>
</html>
