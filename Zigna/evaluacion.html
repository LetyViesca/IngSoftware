<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZIGNA - Evaluación Abecedario</title>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
body { background-color: #f5f7fa; }

/* ===== HEADER ===== */
header { background: white; padding: 10px 5%; border-bottom: 1px solid #f0f0f0; }
nav { display: flex; justify-content: space-between; align-items: center; }
.main-logo { height: 35px; }

.nav-menu {
    list-style: none;
    display: flex;
    gap: 15px;
}

.user-box {
    display: flex;
    align-items: center;
    gap: 15px;
}

.user-icon {
    background:#ff007a;
    width:35px;
    height:35px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
}

/* ===== CONTENIDO ===== */
.container {
    max-width: 900px;
    margin: 30px auto;
}

.question-card {
    background: white;
    border-radius: 15px;
    padding: 20px;
    margin-bottom: 20px;
    border: 2px solid #eee;
}

.correct {
    border: 2px solid #2ecc71;
}

.incorrect {
    border: 2px solid #ff4757;
}

.question-header {
    display: flex;
    gap: 20px;
    align-items: center;
}

.question-img {
    width: 120px;
    height: 120px;
    object-fit: contain;
    background: #eee;
    border-radius: 10px;
}

.options-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.option {
    border: 1px solid #eee;
    padding: 10px;
    border-radius: 8px;
}

.btn {
    padding: 12px 25px;
    border: none;
    border-radius: 20px;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

.btn-primary { background: linear-gradient(90deg,#8a4fff,#ff007a); }
.btn-secondary { background: #555; }

.btn-container {
    text-align: center;
    margin-top: 20px;
}

.resultado {
    text-align: center;
    font-size: 22px;
    margin-top: 20px;
    font-weight: bold;
}
</style>
</head>

<body>

<!-- HEADER -->
<header>
    <nav>
        <a href="inicio.html">
            <img src="imag/Logo_Zigna.png" class="main-logo">
        </a>

        <ul class="nav-menu">
            <li><a href="inicio.html">Inicio</a></li>
            <li><a href="modulos.html">Módulos</a></li>
            <li><a href="progreso.html">Progreso</a></li>
        </ul>

        <div class="user-box">
            <a href="login.html">Cerrar sesión</a>
            <div class="user-icon">👤</div>
        </div>
    </nav>
</header>

<div class="container">

<h2 style="text-align:center; margin-bottom:20px;">Evaluación: Abecedario</h2>

<div id="preguntas"></div>

<div class="btn-container">
    <button class="btn btn-primary" onclick="calificar()">Finalizar Evaluación</button>
</div>

<div id="resultado" class="resultado"></div>

<div class="btn-container">
    <a href="M_abecedario.html">
        <button class="btn btn-secondary">⬅ Volver al módulo</button>
    </a>
</div>

</div>

<script>

const datos = [
{ id:'p1', correcta:'A', img:'imag/abecedario/a.png' },
{ id:'p2', correcta:'B', img:'imag/abecedario/b.png' },
{ id:'p3', correcta:'C', img:'imag/abecedario/c.png' },
{ id:'p4', correcta:'D', img:'imag/abecedario/d.png' },
{ id:'p5', correcta:'E', img:'imag/abecedario/e.png' },
{ id:'p6', correcta:'F', img:'imag/abecedario/f.png' },
{ id:'p7', correcta:'G', img:'imag/abecedario/g.png' },
{ id:'p8', correcta:'H', img:'imag/abecedario/h.png' },
{ id:'p9', correcta:'I', img:'imag/abecedario/i.png' },
{ id:'p10', correcta:'J', img:'imag/abecedario/j.png' }
];

const contenedor = document.getElementById("preguntas");

datos.forEach((p,i)=>{
contenedor.innerHTML += `
<div class="question-card" id="card-${p.id}">
    <div class="question-header">
        <img src="${p.img}" class="question-img">
        <div>
            <p><strong>Pregunta ${i+1}</strong></p>
            <p>¿Qué letra es esta?</p>

            <div class="options-grid">
                <label class="option"><input type="radio" name="${p.id}" value="A"> A</label>
                <label class="option"><input type="radio" name="${p.id}" value="B"> B</label>
                <label class="option"><input type="radio" name="${p.id}" value="C"> C</label>
                <label class="option"><input type="radio" name="${p.id}" value="D"> D</label>
            </div>
        </div>
    </div>
</div>
`;
});

function calificar(){

let aciertos = 0;

datos.forEach(p=>{
    const opciones = document.getElementsByName(p.id);
    const card = document.getElementById("card-"+p.id);

    let respondida = false;
    let correcta = false;

    opciones.forEach(op=>{
        if(op.checked){
            respondida = true;
            if(op.value === p.correcta){
                correcta = true;
                aciertos++;
            }
        }
    });

    if(respondida){
        card.classList.remove("correct","incorrect");
        card.classList.add(correcta ? "correct" : "incorrect");
    }
});

document.getElementById("resultado").innerText = 
"Resultado: " + aciertos + " / 10";

window.scrollTo(0,0);

}

</script>

</body>
</html>
