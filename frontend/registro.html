<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZIGNA - Registro</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { 
            background: linear-gradient(135deg, #8a4fff 0%, #ff007a 100%); 
            height: 100vh; display: flex; align-items: center; justify-content: center; 
        }
        .card { 
            background: white; padding: 40px; border-radius: 20px; 
            width: 100%; max-width: 450px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); 
        }
        h2 { text-align: center; color: #333; margin-bottom: 25px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #666; font-size: 14px; }
        input { 
            width: 100%; padding: 12px; border: 1px solid #ddd; 
            border-radius: 10px; outline: none; transition: 0.3s; 
        }
        input:focus { border-color: #8a4fff; }
        .btn-register { 
            width: 100%; padding: 15px; background: #8a4fff; color: white; 
            border: none; border-radius: 30px; font-weight: bold; cursor: pointer; 
            margin-top: 10px; transition: 0.3s;
        }
        .btn-register:hover { background: #7236e2; }
        .links { text-align: center; margin-top: 20px; font-size: 14px; }
        .links a { color: #ff007a; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Crea tu cuenta</h2>
        <form action="index.html" onsubmit="return validarRegistro()">
            <div class="form-group">
                <label>Nombre(s)</label>
                <input type="text" id="nombre" required placeholder="Tu nombre">
            </div>
            <div class="form-group">
                <label>Apellido Paterno</label>
                <input type="text" id="apellidoP" required placeholder="Tu primer apellido">
            </div>
            <div class="form-group">
                <label>Apellido Materno</label>
                <input type="text" id="apellidoM" required placeholder="Tu segundo apellido">
            </div>

            <div class="form-group">
                <label>Correo Electrónico</label>
                <input type="email" id="email" required placeholder="ejemplo@correo.com">
            </div>

            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" id="pass" required placeholder="Mínimo 6 caracteres">
            </div>
            <div class="form-group">
                <label>Confirmar Contraseña</label>
                <input type="password" id="passConfirm" required placeholder="Repite tu contraseña">
            </div>

            <button type="submit" class="btn-register">Registrarse</button>
        </form>
        
        <div class="links">
            ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
        </div>
    </div>

    <script>
        function validarRegistro() {
            const pass = document.getElementById('pass').value;
            const passConfirm = document.getElementById('passConfirm').value;

            // Validar que las contraseñas coincidan
            if (pass !== passConfirm) {
                alert("Las contraseñas no coinciden. Por favor, verifica.");
                return false;
            }

            // Si todo está bien
            alert("¡Registro exitoso!");
            return true;
        }
    </script>
</body>
</html>
