<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZIGNA - Login</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { 
            background: linear-gradient(135deg, #8a4fff 0%, #ff007a 100%); 
            height: 100vh; display: flex; align-items: center; justify-content: center; 
        }
        .card { 
            background: white; padding: 40px; border-radius: 20px; 
            width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); 
        }
        h2 { text-align: center; color: #333; margin-bottom: 25px; }
        .form-group { margin-bottom: 15px; position: relative; }
        label { display: block; margin-bottom: 5px; color: #666; font-size: 14px; }
        input { 
            width: 100%; padding: 12px; border: 1px solid #ddd; 
            border-radius: 10px; outline: none; 
        }
        .show-pass {
            position: absolute; right: 10px; top: 35px; cursor: pointer; color: #8a4fff; font-size: 12px;
        }
        .btn-login { 
            width: 100%; padding: 15px; background: #8a4fff; color: white; 
            border: none; border-radius: 30px; font-weight: bold; cursor: pointer; 
            margin-top: 10px;
        }
        .links { text-align: center; margin-top: 20px; font-size: 14px; }
        .links a { color: #ff007a; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Bienvenido de nuevo</h2>
        <form onsubmit="return validarLogin(event)">
            <div class="form-group">
                <label>Correo Electrónico</label>
                <input type="email" id="loginEmail" required placeholder="tu@correo.com">
            </div>
            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" id="loginPass" required placeholder="Tu contraseña">
                <span class="show-pass" onclick="togglePass()">👁️ Ver</span>
            </div>
            <button type="submit" class="btn-login">Entrar</button>
        </form>
        <div class="links">
            ¿No tienes cuenta? <a href="registro.html">Regístrate</a>
        </div>
    </div>

    <script>
        function togglePass() {
            const input = document.getElementById('loginPass');
            input.type = input.type === 'password' ? 'text' : 'password';
        }

        function validarLogin(event) {
            event.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const pass = document.getElementById('loginPass').value;

            // Punto 2.1: Validar mensajes de error
            if (email === "admin@zigna.com" && pass === "123456") {
                alert("¡Bienvenido al sistema!");
                window.location.href = "index.html";
            } else {
                alert("Error: Usuario o contraseña incorrectos. Revisa tus datos.");
            }
        }
    </script>
</body>
</html>
