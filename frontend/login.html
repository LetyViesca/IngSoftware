<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZIGNA - Iniciar Sesión</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); 
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }

        .login-card {
            background: white;
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .logo-login { height: 50px; margin-bottom: 20px; }

        h2 { color: #333; margin-bottom: 10px; font-size: 24px; }
        p { color: #777; margin-bottom: 30px; font-size: 14px; }

        .input-group { text-align: left; margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-size: 13px; font-weight: 600; color: #555; }
        
        input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 12px;
            outline: none;
            transition: 0.3s;
        }

        input:focus { border-color: #8a4fff; box-shadow: 0 0 8px rgba(138, 79, 255, 0.2); }

        .btn-login {
            width: 100%;
            background: #8a4fff;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        .btn-login:hover { background: #7138e6; transform: translateY(-2px); }

        .footer-links { margin-top: 25px; font-size: 13px; color: #888; }
        .footer-links a { color: #2cc19c; text-decoration: none; font-weight: bold; }
/* ESTO CUMPLE CON EL RF-01 y RF-02 (Borde rojo en error) */
        input:invalid:not(:placeholder-shown) {
            border: 2px solid #ff007a;
            background-color: #fff0f5; /* Un tono rosado muy suave de fondo */
        }

        /* Esto es para que cuando el usuario escriba bien, se ponga verde (opcional pero pro) */
        input:valid:not(:placeholder-shown) {
            border: 2px solid #2cc19c;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <img src="img/logo_zigna.jpeg" alt="ZIGNA" class="logo-login">
        
        <h2>¡Bienvenido de nuevo!</h2>
        <p>Ingresa tus datos para continuar aprendiendo.</p>

        <form action="index.html"> <div class="input-group">
                <label>Correo Electrónico</label>
                <input type="email" placeholder="ejemplo@correo.com" required>
            </div>

            <div class="input-group">
                <label>Contraseña</label>
                <input type="password" placeholder="••••••••" minlength="8" required>            </div>
<p id="error-message" style="color: #ff007a; font-size: 12px; margin-bottom: 10px; display: none;">
        ⚠️ Las credenciales son incorrectas o hay campos vacíos.
    </p>

            <button type="submit" class="btn-login">Entrar</button>
        </form>

        <div class="footer-links">
            ¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a>
        </div>
    </div>

</body>
</html>
